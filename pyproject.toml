[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=42",
  "wheel",
]

[project]
name = "basic"
version = "0.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "hyperactive>=4.4",
  "ipykernel>=6.30.1",
  "jax>=0.4.7",
  "jaxlib>=0.4.7",
  "matplotlib>=3.10.5",
  "numpy",
  "pooch",
  "pydantic>=2.7,<3",
  "pyinstaller>=6.16",
  "python-bioformats",
  "scikit-image",
  "scipy<1.13",
  "torch",
  "torchdyn>=1.0.6",
  "torchvision",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
