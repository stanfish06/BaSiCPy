name: BaSiC

# Create this environment from the repository root:
#   conda env create -f runner/env.yml
# Then run the runner from the repository root as well:
#   conda activate BaSiC
#   python runner/run_basic.py ...
#
# Bio-Formats / Javabridge note:
# - Linux and Intel macOS can use this file natively.
# - Apple Silicon cannot solve `python-bioformats` natively because the
#   required Javabridge package is only published for `osx-64`, not `osx-arm64`.
#   Use Rosetta / x86_64 conda instead:
#     softwareupdate --install-rosetta --agree-to-license
#     CONDA_SUBDIR=osx-64 conda env create -n BaSiC -f runner/env.yml
#     conda activate BaSiC
#     conda config --env --set subdir osx-64
#   The Rosetta env also needs an older PyTorch wheel line because recent macOS
#   PyPI wheels are arm64-only.
# - Native Windows conda solves for the Bio-Formats bridge are not currently
#   available; use WSL/Linux if you need Bio-Formats there.
channels:
  - conda-forge
  - bioconda

variables:
  PYTHONPATH: src

dependencies:
  - python=3.10.*
  - pip
  - numpy=1.26.*
  - scipy<1.13
  - scikit-image
  - dask
  - pydantic>=2.7,<3
  - pooch
  - tifffile
  - tqdm
  - openjdk=17.*
  - python-bioformats  # native solve works on linux-64 and osx-64
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - "torch==2.11.0+cu128; sys_platform == 'linux'"
      - "torch==2.11.0; sys_platform == 'win32'"
      - "torch==2.11.0; sys_platform == 'darwin' and platform_machine != 'x86_64'"
      - "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'"
      - hyperactive>=4.4.0
      - torch-dct
